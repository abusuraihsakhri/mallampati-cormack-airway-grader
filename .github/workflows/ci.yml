name: CI and security checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      AUDIT_SECRET_KEY: "ci-synthetic-only-key-not-for-deployment"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q airway_grader.py cli.py agents enrichment.py simulator.py
      - name: Test
        run: python -m pytest -q
      - name: Browser script static checks
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          content = Path("web/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", content, re.DOTALL)
          assert len(scripts) == 1
          assert '<form' in content
          assert "fetch('/api/audit')" not in content
          assert "Simulation Output" not in content
          Path("/tmp/airway-browser-app.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/airway-browser-app.js
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r requirements.txt
  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build -t airway-grading-reference:ci .
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_smoke.py
