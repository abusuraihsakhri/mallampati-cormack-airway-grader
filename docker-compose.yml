services:
  mallampati-cormack-airway-grader:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AUDIT_SECRET_KEY: ${AUDIT_SECRET_KEY:?Define AUDIT_SECRET_KEY in your environment}
      API_ACCESS_TOKEN: ${API_ACCESS_TOKEN:?Define API_ACCESS_TOKEN in your environment}
    restart: unless-stopped
